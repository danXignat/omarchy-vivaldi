name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Lint
        run: shellcheck bin/vivaldi-omarchy hooks/* tests/run.sh
      - name: Test
        run: tests/run.sh
